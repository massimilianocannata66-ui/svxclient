name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compila l'APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          DIR=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)")
          cd "$DIR"
          gradle assembleDebug --no-daemon
      - name: Controllo libreria Concentus
        if: always()
        run: |
          echo "=== JAR TROVATI ==="
          find ~/.gradle -iname "*concentus*.jar" | head
          for J in $(find ~/.gradle -iname "*concentus*.jar" -not -name "*sources*" -not -name "*javadoc*" | head -3); do
            echo "=== CONTENUTO $J ==="
            unzip -l "$J" | grep -E "OpusEncoder|OpusDecoder|OpusApplication|OpusSignal" | head
          done
      - uses: actions/upload-artifact@v4
        with:
          name: svx-client-apk
          path: "**/app-debug.apk"
